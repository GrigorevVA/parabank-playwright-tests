name: tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# a new push to a PR cancels its previous run; runs on main always finish
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tests:
    name: tests (${{ matrix.project }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      # each project gets its own stand, so they run in parallel despite workers: 1
      matrix:
        project: [api, bdd]
    # same image as docker/Dockerfile: browsers and system deps are already inside
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:7852dc5a7d72f5fe458a597d690f6c42fbc8e9e26ddfa95f8e6ef552558d9bbf
      options: --ipc=host --init
    services:
      parabank:
        image: parasoft/parabank@sha256:f41126b4c1a293643ef86dfc2b29955c0d59e1dc992797f48f00298c68a717ab
        # Tomcat opens the port only after the app is deployed;
        # the global setup then creates the database tables
        options: >-
          --health-cmd "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
          --health-start-period 20s
    env:
      PARABANK_URL: http://parabank:8080/parabank
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # npm ci always reinstalls node_modules, the cache keeps the downloaded packages
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: npm-${{ hashFiles('package-lock.json') }}

      - run: npm ci

      - run: npx bddgen && npx playwright test --project=${{ matrix.project }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: allure-results-${{ matrix.project }}
          path: allure-results/
          retention-days: 7

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ failure() }}
        with:
          name: playwright-report-${{ matrix.project }}
          path: playwright-report/
          retention-days: 7

  report:
    needs: tests
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:7852dc5a7d72f5fe458a597d690f6c42fbc8e9e26ddfa95f8e6ef552558d9bbf
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: npm-${{ hashFiles('package-lock.json') }}

      - run: npm ci

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: allure-results-*
          path: allure-results/
          merge-multiple: true

      # the published report carries history.jsonl (see allurerc.ts);
      # before the first deploy the site answers 404 and history starts empty;
      # the run id bypasses the Pages CDN cache
      - name: Restore Allure history from GitHub Pages
        run: |
          mkdir -p allure-report
          node -e "fetch(process.argv[1]).then((r) => (r.ok ? r.text() : '')).then((t) => require('fs').writeFileSync('allure-report/history.jsonl', t))" \
            "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/history.jsonl?run=${{ github.run_id }}"

      - run: npx allure generate

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: allure-report
          path: allure-report/
          retention-days: 7

  # the only job with write access; runs for main only (push or manual run), never for PRs, without cache
  publish:
    needs: report
    if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: allure-report
          path: allure-report/

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: allure-report/

      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
