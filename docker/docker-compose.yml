name: parabank-tests

services:
  parabank:
    image: parasoft/parabank@sha256:f41126b4c1a293643ef86dfc2b29955c0d59e1dc992797f48f00298c68a717ab
    ports:
      - "127.0.0.1:8080:8080"
    # the image has no curl or wget, bash /dev/tcp is enough for a plain HTTP check;
    # a fresh database answers 302 to initializeDB.htm, the app is up either way
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/8080
          && printf 'GET /parabank/index.htm HTTP/1.0\r\n\r\n' >&3
          && read -r status <&3
          && [[ $$status == *' 200'* || $$status == *' 302'* ]]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  tests:
    profiles: [tests]
    build:
      context: ..
      dockerfile: docker/Dockerfile
    depends_on:
      parabank:
        condition: service_healthy
    environment:
      PARABANK_URL: http://parabank:8080/parabank
    # recommended for Chromium in Docker
    init: true
    ipc: host
    volumes:
      - ../allure-results:/app/allure-results
